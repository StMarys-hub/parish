name: CI — Lint, Unit Tests, Build & E2E Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Unit & parser test suite
        run: npm run test

      - name: Production Vite + PWA build
        run: npm run build

      - name: Install Playwright Chromium for E2E smoke test
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run E2E smoke test against production preview
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 &
          PREVIEW_PID=$!
          trap "kill $PREVIEW_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 0.5
          done
          SMOKE_BASE_URL=http://127.0.0.1:4173 node scripts/e2e-smoke.mjs
