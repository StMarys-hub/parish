<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="St. Mary's Syro-Malabar Catholic Church Emblem">
  <defs>
    <linearGradient id="marianBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#244B7A" />
      <stop offset="55%" stop-color="#173257" />
      <stop offset="100%" stop-color="#0D1D36" />
    </linearGradient>
    <radialGradient id="haloGlow" cx="50%" cy="46%" r="44%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.34" />
      <stop offset="60%" stop-color="#D4AF37" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#A67608" />
    </linearGradient>
    <linearGradient id="crossIvory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#FAF3DF" />
      <stop offset="100%" stop-color="#EAD292" />
    </linearGradient>
  </defs>

  <!-- Rounded Square Marian Royal Blue Backdrop -->
  <rect width="512" height="512" rx="112" fill="url(#marianBg)" />
  <circle cx="256" cy="242" r="210" fill="url(#haloGlow)" />

  <!-- Outer & Inner Liturgical Gold Arch Frame -->
  <circle cx="256" cy="256" r="214" fill="none" stroke="url(#goldRing)" stroke-width="10" />
  <circle cx="256" cy="256" r="196" fill="none" stroke="#FDE68A" stroke-opacity="0.35" stroke-width="2.5" />

  <!-- Subtle Twelve Marian Stars Accent Dots around Upper Halo -->
  <g fill="#FDE68A" opacity="0.88">
    <circle cx="256" cy="76" r="5" />
    <circle cx="204" cy="84" r="4" />
    <circle cx="308" cy="84" r="4" />
    <circle cx="158" cy="108" r="3.5" />
    <circle cx="354" cy="108" r="3.5" />
  </g>

  <!-- Descending Holy Spirit Dove Silhouette above the Mar Thoma Cross -->
  <g fill="url(#goldRing)">
    <path d="M256 128c-6-12-22-18-36-14 10 8 18 16 20 26-10-4-20-2-28 4 12 4 24 6 36 3 4 5 8 10 8 14 0-4 4-9 8-14 12 3 24 1 36-3-8-6-18-8-28-4 2-10 10-18 20-26-14-4-30 2-36 14z" />
  </g>

  <!-- Syro-Malabar Mar Thoma Cross (Budding Trefoil Arms) -->
  <g fill="url(#crossIvory)" stroke="#B8860B" stroke-width="4" stroke-linejoin="round">
    <!-- Vertical & Horizontal Shaft -->
    <path d="M238 158h36v66h74v36h-74v92h-36v-92h-74v-36h74z" />

    <!-- Top Trefoil Bud -->
    <circle cx="256" cy="148" r="14" />
    <circle cx="238" cy="158" r="10" />
    <circle cx="274" cy="158" r="10" />

    <!-- Left Trefoil Bud -->
    <circle cx="154" cy="242" r="14" />
    <circle cx="164" cy="224" r="10" />
    <circle cx="164" cy="260" r="10" />

    <!-- Right Trefoil Bud -->
    <circle cx="358" cy="242" r="14" />
    <circle cx="348" cy="224" r="10" />
    <circle cx="348" cy="260" r="10" />
  </g>

  <!-- Center Liturgical Gold Medallion -->
  <circle cx="256" cy="242" r="16" fill="url(#goldRing)" stroke="#173257" stroke-width="3" />
  <circle cx="256" cy="242" r="6" fill="#FFFFFF" />

  <!-- Syro-Malabar 3-Petaled Lotus Base -->
  <g fill="url(#goldRing)" stroke="#173257" stroke-width="2.5">
    <path d="M256 346c-18 0-32 10-38 22h76c-6-12-20-22-38-22z" />
    <path d="M220 366c-22-14-46-12-58-2 14 14 34 20 56 16z" />
    <path d="M292 366c22-14 46-12 58-2-14 14-34 20-56 16z" />
  </g>

  <!-- Three-Step Calvary Pedestal with Marian "M" Emblem -->
  <rect x="196" y="370" width="120" height="16" rx="5" fill="url(#crossIvory)" stroke="#B8860B" stroke-width="3" />
  <rect x="172" y="388" width="168" height="18" rx="6" fill="url(#goldRing)" />

  <!-- Subtle Crisp Marian Monogram ("M") on Pedestal -->
  <path
    d="M236 432v-22l20 15 20-15v22"
    fill="none"
    stroke="#FDE68A"
    stroke-width="6.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
